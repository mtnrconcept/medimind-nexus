name: Prepare isolated remediation tooling
on:
  push:
    branches: [codex/remediation-science-design-20260906]
    paths: [.github/workflows/medicore-remediation-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create isolated workspace and verify source
        run: |
          test -z "$(git status --porcelain)"
          git worktree add --detach /tmp/medicore-tooling HEAD
          cd /tmp/medicore-tooling
          test -z "$(git status --porcelain)"
          cat AGENTS.md
          git rev-parse HEAD
          mkdir -p /tmp/medicore-quality
      - name: Prepare compatible dependency changes for review
        working-directory: /tmp/medicore-tooling
        run: |
          npm ci
          npm audit --omit=dev --json > /tmp/medicore-quality/audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts > /tmp/medicore-quality/audit-fix.log 2>&1 || true
          npm install --save-exact --ignore-scripts https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          npm ci
          npm audit --omit=dev --json > /tmp/medicore-quality/audit-after.json || true
          git diff -- package.json package-lock.json > /tmp/medicore-quality/dependencies.patch
          cp package.json package-lock.json /tmp/medicore-quality/
          npm test
          tar -czf /tmp/medicore-quality/dependencies.tgz node_modules
          sha256sum /tmp/medicore-quality/dependencies.tgz > /tmp/medicore-quality/dependencies.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicore-quality-inputs
          path: /tmp/medicore-quality/
          retention-days: 1
          if-no-files-found: error
