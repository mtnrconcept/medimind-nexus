name: Prepare isolated remediation tooling
on:
  push:
    branches: [codex/remediation-science-design-20260906]
    paths: [.github/workflows/medicore-remediation-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create isolated workspace and verify source
        run: |
          test -z "$(git status --porcelain)"
          git worktree add --detach /tmp/medicore-tooling HEAD
          cd /tmp/medicore-tooling
          test -z "$(git status --porcelain)"
          cat AGENTS.md
          git rev-parse HEAD
          mkdir -p /tmp/medicore-quality
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.2
      - name: Read schema types without exporting records or credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SCHEMA_TYPES=UNAVAILABLE_MISSING_CI_ACCESS_TOKEN' > /tmp/medicore-quality/schema-status.txt
          elif supabase gen types typescript --project-id kparxcfspgoonqttduyk --schema public > /tmp/medicore-quality/database-types.ts 2> /tmp/schema-error.log; then
            echo 'SCHEMA_TYPES=GENERATED_FROM_LIVE_SCHEMA' > /tmp/medicore-quality/schema-status.txt
          else
            rm -f /tmp/medicore-quality/database-types.ts
            echo 'SCHEMA_TYPES=UNAVAILABLE_GENERATION_FAILED' > /tmp/medicore-quality/schema-status.txt
          fi
          cat /tmp/medicore-quality/schema-status.txt
      - name: Prepare compatible dependency changes for review
        working-directory: /tmp/medicore-tooling
        run: |
          npm ci
          npm audit --omit=dev --json > /tmp/medicore-quality/audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts > /tmp/medicore-quality/audit-fix.log 2>&1 || true
          npm ci
          npm audit --omit=dev --json > /tmp/medicore-quality/audit-after.json || true
          git diff -- package.json package-lock.json > /tmp/medicore-quality/dependencies.patch
          cp package.json package-lock.json /tmp/medicore-quality/
          npm test
          tar -czf /tmp/medicore-quality/dependencies.tgz node_modules
          sha256sum /tmp/medicore-quality/dependencies.tgz > /tmp/medicore-quality/dependencies.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicore-quality-inputs
          path: /tmp/medicore-quality/
          retention-days: 1
          if-no-files-found: error
