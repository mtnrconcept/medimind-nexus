name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  frontend:
    name: Test, focused typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx tsx --test --test-concurrency=1 tests/*.test.ts

      - name: Focused clinical typecheck
        run: npm run typecheck

      - name: Typecheck microsignal engine and synthetic cohort
        run: npm run typecheck:microsignals

      - name: Typecheck authorized patient pathology matching
        run: npm run typecheck:patient-matching

      - name: Typecheck clinical workspace and navigation
        run: npm run typecheck:workspace

      - name: Typecheck AI continuity, recovery and activity panel
        run: npx tsc -p tsconfig.ai-continuity.json --pretty false

      - name: Typecheck scientific library and matrix UI
        run: npx tsc -p tsconfig.scientific-library.json --pretty false

      - name: Typecheck anatomical atlas viewer
        run: npx tsc -p tsconfig.anatomical-twin.json --pretty false

      - name: Edge signal-detector syntax and local imports
        run: npm run check:signal-edge

      - name: Typecheck scientific research and durable AI Edge Functions
        run: >-
          npx --yes deno@2.9.6 check --no-lock --node-modules-dir=manual
          supabase/functions/scientific-evidence/index.ts
          supabase/functions/deep-research-graph/index.ts
          supabase/functions/cross-data-analyzer/index.ts
          supabase/functions/ai-tool-jobs/index.ts
          supabase/functions/causal-reasoning/index.ts
          supabase/functions/deep-research/index.ts
          supabase/functions/cde-analyze/index.ts
          supabase/functions/cde-systematic-analyze/index.ts
          supabase/functions/patient-health-synthesis/index.ts
          supabase/functions/discovery-platform/index.ts
          supabase/functions/hypothesis-processor/index.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production dependency audit (critical gate)
        run: node scripts/audit-production.mjs

  security-migration:
    name: PostgreSQL 17 security migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medimind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medimind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: medimind_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Bootstrap representative schema
        run: psql -v ON_ERROR_STOP=1 -f tests/clinical-security-bootstrap.sql

      - name: Apply clinical security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260905180144_20260905183000_clinical_security_foundation.sql

      - name: Assert authorization and provenance behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/clinical-security-assertions.sql

      - name: Apply research evidence integrity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101044524_20261031071206_secure_discovery_evidence.sql

      - name: Assert evidence write isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/discovery-evidence-security-assertions.sql

      - name: Prepare bibliographic fixture columns
        run: psql -v ON_ERROR_STOP=1 -f tests/medical-library-bootstrap.sql

      - name: Apply searchable French literature migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104225342_searchable_french_literature.sql

      - name: Assert bilingual bibliographic search is role restricted
        run: psql -v ON_ERROR_STOP=1 -f tests/medical-library-security-assertions.sql

      - name: Apply private AI transport events migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104214546_durable_ai_transport.sql

      - name: Assert private AI transport event access and replay constraints
        run: psql -v ON_ERROR_STOP=1 -f tests/ai-transport-security-assertions.sql
