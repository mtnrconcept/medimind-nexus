name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  frontend:
    name: Test, focused typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Focused clinical typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: node scripts/audit-production.mjs

  security-migration:
    name: PostgreSQL 17 security migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medimind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medimind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: medimind_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Bootstrap representative schema
        run: psql -v ON_ERROR_STOP=1 -f tests/clinical-security-bootstrap.sql

      - name: Apply clinical security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260905183000_clinical_security_foundation.sql

      - name: Assert authorization and provenance behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/clinical-security-assertions.sql
